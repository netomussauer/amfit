---
# ServiceAccount usado por todos os PipelineRuns do AMFIT.
# Referencia os Secrets harbor-creds (push de imagem) e gitea-creds (clone).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-amfit
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: ci-serviceaccount
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
secrets:
  - name: gitea-creds
imagePullSecrets:
  - name: harbor-creds
---
# RBAC mínimo: a SA precisa criar/ler PipelineRuns e TaskRuns no próprio namespace
# (necessário para Triggers criarem PipelineRuns) e ler os Secrets harbor-creds e
# gitea-creds montados pelos PipelineRuns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-amfit
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
rules:
  - apiGroups: ["tekton.dev"]
    resources:
      - pipelineruns
      - taskruns
      - pipelines
      - tasks
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["harbor-creds", "gitea-creds"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-amfit
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
subjects:
  - kind: ServiceAccount
    name: tekton-amfit
    namespace: cicd
roleRef:
  kind: Role
  name: tekton-amfit
  apiGroup: rbac.authorization.k8s.io
---
# Permissoes que o EventListener precisa para listar/watch recursos do
# Tekton Triggers no proprio namespace (Trigger, TriggerBinding,
# TriggerTemplate, EventListener, Interceptor). ClusterRole instalado
# automaticamente pelo Tekton Triggers.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-amfit-triggers
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
subjects:
  - kind: ServiceAccount
    name: tekton-amfit
    namespace: cicd
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
# Permissoes cluster-scoped — ClusterTriggerBinding e ClusterInterceptor
# (que e onde os interceptors gitea/cel ficam). Tambem instalado pelo
# Tekton Triggers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-amfit-triggers-cluster
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
subjects:
  - kind: ServiceAccount
    name: tekton-amfit
    namespace: cicd
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
