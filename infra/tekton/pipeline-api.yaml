---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: amfit-build-api
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipeline-api
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  description: |
    Pipeline de build + push da imagem AMFIT API (Go).
    Stages: git-clone -> go test -race -> kaniko build/push (apps/api/).
    Reutiliza as Tasks `git-clone` e `kaniko-build-push` ja existentes
    no namespace `cicd` (compartilhadas com outros pipelines do lab).
    Falha fast: qualquer task com erro aborta o pipeline.
  params:
    - name: git-url
      type: string
      default: http://gitea.lab.local/labadmin/amfit.git
      description: URL do repositorio Gitea (mirror).
    - name: git-revision
      type: string
      default: main
      description: Branch/tag/SHA a buildar.
    - name: image-repo
      type: string
      default: harbor.lab.local/amfit/api
      description: Repositorio Harbor de destino.
    - name: image-tag
      type: string
      default: latest
      description: Tag da imagem.
  workspaces:
    - name: source
      description: Workspace onde o codigo e clonado e compartilhado entre tasks.
    - name: docker-credentials
      description: Workspace que monta o Secret harbor-creds para o Kaniko.
  results:
    # NOTA: a Task lab `kaniko-build-push` declara result `image-url` mas nao
    # o emite — so emite `image-digest`. Removido daqui para evitar
    # CouldntGetPipelineResult cosmetico.
    - name: image-digest
      description: Digest sha256 da imagem publicada.
      value: $(tasks.kaniko-build-push.results.image-digest)
    - name: commit
      description: SHA do commit buildado.
      value: $(tasks.git-clone.results.commit)

  tasks:
    - name: git-clone
      taskRef:
        name: amfit-git-clone
        kind: Task
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source

    # golang-test reativado: a falha anterior em `go mod download` para
    # pgservicefile era go.sum vazio (0 linhas). Repopulado via
    # `go mod tidy` em pod golang temporario; agora -mod=readonly da Task
    # encontra todos os hashes.
    - name: golang-test
      runAfter: [git-clone]
      # Retry: absorve timeout transiente de rede em `go mod download`
      # (TLS handshake timeout pro proxy.golang.org — achado em 2026-09-08).
      retries: 2
      taskRef: { name: golang-test, kind: Task }
      params:
        - { name: package-path, value: apps/api }
        - { name: go-version, value: "1.22" }
      workspaces:
        - { name: source, workspace: source }

    - name: kaniko-build-push
      runAfter:
        - golang-test
      # Retry + timeout curto: absorve timeouts transientes de rede
      # alcancando o token service do Harbor (achado em 2026-09-08). O
      # timeout default da task e 30m — kaniko (assim como o cliente HTTP
      # do Go em golang-test) faz seu proprio retry/backoff interno bem
      # mais longo que isso, entao uma unica tentativa pode consumir os 30m
      # inteiros sem nunca dar chance do `retries` do PipelineTask agir.
      # 15m por tentativa, 1 retry (mesmo orcamento do build do Web). O
      # build da API NAO e mais "< 1min": medido em 2026-10-27, a etapa leva
      # ~6,2 min com so as dependencias de runtime (47e86e5) e ~7,5 min depois
      # que o go.mod passou a incluir as dependencias dos testes de integracao
      # (testcontainers etc., baixadas pelo `go mod download`). Com o limite
      # anterior de 8m e 2 retries, qualquer lentidao do node estourava a
      # tentativa, repetia 3x (3 x 8m = 24m) e o PipelineRun inteiro caia em
      # PipelineRunTimeout (tasks: 30m) sem publicar imagem — aconteceu em
      # fae0f34 e b24f0ad. So 1 retry mantem o pior caso dentro do orcamento
      # de tasks (golang-test ~9m + 15m + retry).
      retries: 1
      timeout: "15m"
      taskRef:
        name: kaniko-build-push
        kind: Task
      params:
        - name: image
          value: $(params.image-repo)
        - name: tag
          value: $(params.image-tag)
        # Caminhos sao relativos ao `context` (Task lab passa `--context=dir://`)
        - name: dockerfile
          value: Dockerfile
        - name: context
          value: apps/api
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials

    # Deployment usa tag :latest (sem mudanca no manifesto a cada build),
    # entao nem kubectl nem o ArgoCD reiniciam os pods sozinhos apos um
    # push — sem este step, uma imagem nova fica publicada no Harbor mas
    # nunca chega a rodar (achado em 2026-09-08). Mesmo padrao do
    # REALTPMSYS (task inline "rollout-restart" no pipeline dele). Exige a
    # Role/RoleBinding em infra/k8s/rbac-tekton-rollout.yaml.
    - name: rollout-restart
      runAfter:
        - kaniko-build-push
      taskSpec:
        description: |
          Reinicia o Deployment amfit-api no ns amfit e aguarda ate 3min o
          rollout completar.
        steps:
          - name: restart
            image: docker.io/bitnami/kubectl:latest
            script: |
              #!/bin/sh
              set -eu
              echo "→ kubectl rollout restart deployment/amfit-api -n amfit"
              kubectl rollout restart deployment/amfit-api -n amfit
              echo "→ kubectl rollout status (timeout 3m)"
              kubectl rollout status deployment/amfit-api -n amfit --timeout=3m
