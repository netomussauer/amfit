---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: amfit-build-api
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipeline-api
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  description: |
    Pipeline de build + push da imagem AMFIT API (Go).
    Stages: git-clone -> go test -race -> kaniko build/push (apps/api/).
    Reutiliza as Tasks `git-clone` e `kaniko-build-push` ja existentes
    no namespace `cicd` (compartilhadas com outros pipelines do lab).
    Falha fast: qualquer task com erro aborta o pipeline.
  params:
    - name: git-url
      type: string
      default: http://gitea.lab.local/labadmin/amfit.git
      description: URL do repositorio Gitea (mirror).
    - name: git-revision
      type: string
      default: main
      description: Branch/tag/SHA a buildar.
    - name: image-repo
      type: string
      default: harbor.infra.local/amfit/api
      description: Repositorio Harbor de destino.
    - name: image-tag
      type: string
      default: latest
      description: Tag da imagem.
  workspaces:
    - name: source
      description: Workspace onde o codigo e clonado e compartilhado entre tasks.
    - name: docker-credentials
      description: Workspace que monta o Secret harbor-creds para o Kaniko.
  results:
    - name: image-url
      description: URL completa da imagem publicada (repo:tag).
      value: $(tasks.kaniko-build-push.results.image-url)
    - name: image-digest
      description: Digest sha256 da imagem publicada.
      value: $(tasks.kaniko-build-push.results.image-digest)
    - name: commit
      description: SHA do commit buildado.
      value: $(tasks.git-clone.results.commit)

  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: Task
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source

    - name: golang-test
      runAfter:
        - git-clone
      taskRef:
        name: golang-test
        kind: Task
      params:
        - name: package-path
          value: apps/api
        - name: go-version
          value: "1.22"
      workspaces:
        - name: source
          workspace: source

    - name: kaniko-build-push
      runAfter:
        - golang-test
      taskRef:
        name: kaniko-build-push
        kind: Task
      params:
        - name: image
          value: $(params.image-repo)
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: apps/api/Dockerfile
        - name: context
          value: apps/api
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials
