---
# Kustomization para apply ordenado de toda a stack Tekton do AMFIT.
#
#   kubectl apply -k infra/tekton/
#
# IMPORTANTE: secret-template.yaml NÃO está incluído aqui. Crie os Secrets
# reais (harbor-creds, gitea-creds, gitea-webhook-secret) via
# `kubectl create secret` antes de aplicar este kustomization.
# Veja README.md e secret-template.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cicd

commonLabels:
  app.kubernetes.io/part-of: amfit
  lab_id: lab-k8s-01
  lab_owner: jose.mussauer

resources:
  - serviceaccount.yaml
  # Tasks especificas do AMFIT:
  # - task-amfit-git-clone: substitui a Task git-clone do lab (alpine/git
  #   tem bug de musl getaddrinfo com plugin hosts do CoreDNS).
  # - task-golang-test: testes Go.
  # A Task `kaniko-build-push` continua sendo reutilizada da existente em
  # ns cicd (alinhada com a infra-lab base — Kaniko nao tem o problema do
  # alpine/git pois resolve hostnames via Docker config / Go net package).
  - task-amfit-git-clone.yaml
  - task-golang-test.yaml
  - pipeline-api.yaml
  - pipeline-web.yaml
  - trigger-amfit.yaml
