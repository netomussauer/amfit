---
# Smoke run manual — dispara o pipeline amfit-build-api uma vez.
# Use `kubectl create -f` (não `apply`) para gerar um nome único a cada execução.
#
#   kubectl create -f infra/tekton/pipelinerun-api-manual.yaml -n cicd
#
# Acompanhe os logs com:
#   tkn pipelinerun logs -L -f -n cicd
#   # ou
#   kubectl get pipelinerun -n cicd -w
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: amfit-build-api-manual-
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipelinerun-api
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
    tekton.dev/pipeline: amfit-build-api
    trigger: manual
spec:
  pipelineRef:
    name: amfit-build-api
  # Em tekton.dev/v1, serviceAccountName e podTemplate ficam dentro de
  # taskRunTemplate (antes eram top-level no v1beta1).
  taskRunTemplate:
    serviceAccountName: tekton-amfit
    podTemplate:
      nodeSelector:
        workload: cicd
      tolerations:
        - key: workload
          operator: Equal
          value: cicd
          effect: NoSchedule
      securityContext:
        fsGroup: 65532
  timeouts:
    pipeline: "45m"
    tasks: "30m"
  params:
    # Usar FQDN K8s interno + porta correta (gitea-http expoe 3000).
    # Hostname externo gitea.lab.local nao tem porta 80 (LB mapeia 3000:32279).
    - name: git-url
      value: http://gitea-http.cicd.svc.cluster.local:3000/labadmin/amfit.git
    - name: git-revision
      value: main
    - name: image-repo
      value: harbor.lab.local/amfit/api
    - name: image-tag
      value: latest
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi
    - name: docker-credentials
      secret:
        secretName: harbor-creds
