---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: amfit-build-web
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipeline-web
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  description: |
    Pipeline de build + push da imagem AMFIT Web (Next.js).
    Stages: git-clone -> kaniko build/push (contexto = raiz do monorepo,
    pois o Dockerfile depende de packages/shared/).
    Reutiliza as Tasks `git-clone` e `kaniko-build-push` ja existentes
    no namespace `cicd`.
  params:
    - name: git-url
      type: string
      default: http://gitea.lab.local/labadmin/amfit.git
    - name: git-revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: harbor.lab.local/amfit/web
    - name: image-tag
      type: string
      default: latest
  workspaces:
    - name: source
    - name: docker-credentials
  results:
    # NOTA: Task lab `kaniko-build-push` declara mas nao emite `image-url`.
    - name: image-digest
      value: $(tasks.kaniko-build-push.results.image-digest)
    - name: commit
      value: $(tasks.git-clone.results.commit)

  tasks:
    - name: git-clone
      taskRef:
        name: amfit-git-clone
        kind: Task
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source

    - name: kaniko-build-push
      runAfter:
        - git-clone
      taskRef:
        name: kaniko-build-push
        kind: Task
      params:
        - name: image
          value: $(params.image-repo)
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: apps/web/Dockerfile
        - name: context
          value: "."
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials
