---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: amfit-build-web
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipeline-web
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  description: |
    Pipeline de build + push da imagem AMFIT Web (Next.js).
    Stages: git-clone -> kaniko build/push (contexto = raiz do monorepo,
    pois o Dockerfile depende de packages/shared/).
    Reutiliza as Tasks `git-clone` e `kaniko-build-push` ja existentes
    no namespace `cicd`.
  params:
    - name: git-url
      type: string
      default: http://gitea.lab.local/labadmin/amfit.git
    - name: git-revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: harbor.lab.local/amfit/web
    - name: image-tag
      type: string
      default: latest
  workspaces:
    - name: source
    - name: docker-credentials
  results:
    # NOTA: Task lab `kaniko-build-push` declara mas nao emite `image-url`.
    - name: image-digest
      value: $(tasks.kaniko-build-push.results.image-digest)
    - name: commit
      value: $(tasks.git-clone.results.commit)

  tasks:
    - name: git-clone
      taskRef:
        name: amfit-git-clone
        kind: Task
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"
      workspaces:
        - name: source
          workspace: source

    - name: kaniko-build-push
      runAfter:
        - git-clone
      # Retry + timeout curto: absorve timeouts transientes de rede
      # alcancando o registry npm ou o token service do Harbor (achado em
      # 2026-09-08). O timeout default da task e 30m — kaniko faz seu
      # proprio retry/backoff interno bem mais longo que isso, entao uma
      # unica tentativa pode consumir os 30m inteiros sem nunca dar chance
      # do `retries` do PipelineTask agir. 15m por tentativa (so 1 retry,
      # nao 2 como na API) porque o build do Web e mais pesado (pnpm
      # install + build do Next.js) — precisa de mais tempo por tentativa
      # mesmo com rede saudavel, entao um orcamento total menor de
      # tentativas evita estourar o timeout de 45m do pipeline inteiro.
      retries: 1
      timeout: "15m"
      taskRef:
        name: kaniko-build-push
        kind: Task
      params:
        - name: image
          value: $(params.image-repo)
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: apps/web/Dockerfile
        - name: context
          value: "."
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials

    # Deployment usa tag :latest (sem mudanca no manifesto a cada build),
    # entao nem kubectl nem o ArgoCD reiniciam os pods sozinhos apos um
    # push — sem este step, uma imagem nova fica publicada no Harbor mas
    # nunca chega a rodar (achado em 2026-09-08). Mesmo padrao do
    # REALTPMSYS. Exige a Role/RoleBinding em
    # infra/k8s/rbac-tekton-rollout.yaml.
    - name: rollout-restart
      runAfter:
        - kaniko-build-push
      taskSpec:
        description: |
          Reinicia o Deployment amfit-web no ns amfit e aguarda ate 3min o
          rollout completar.
        steps:
          - name: restart
            image: docker.io/bitnami/kubectl:latest
            script: |
              #!/bin/sh
              set -eu
              echo "→ kubectl rollout restart deployment/amfit-web -n amfit"
              kubectl rollout restart deployment/amfit-web -n amfit
              echo "→ kubectl rollout status (timeout 3m)"
              kubectl rollout status deployment/amfit-web -n amfit --timeout=3m
