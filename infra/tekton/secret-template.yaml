# =============================================================================
# TEMPLATE — NÃO COMMITAR CREDENCIAIS REAIS NESTE ARQUIVO.
# =============================================================================
# Este arquivo serve apenas como referência das chaves esperadas pelos Secrets.
# Crie os Secrets reais via `kubectl create secret` (FORA do Git):
#
#   # 1. harbor-creds — push de imagens em harbor.infra.local
#   kubectl create secret docker-registry harbor-creds \
#     --docker-server=harbor.infra.local \
#     --docker-username=<HARBOR_USER> \
#     --docker-password=<HARBOR_PASSWORD_OR_CLI_SECRET> \
#     --docker-email=jose.mussauer@stone.com.br \
#     -n cicd
#
#   # 2. gitea-creds — clone do repo privado http://gitea.lab.local/labadmin/amfit.git
#   #    O username/password (token) precisa ter pelo menos read:repository.
#   kubectl create secret generic gitea-creds \
#     --type=kubernetes.io/basic-auth \
#     --from-literal=username=<GITEA_USER> \
#     --from-literal=password=<GITEA_TOKEN> \
#     -n cicd
#
#   kubectl annotate secret gitea-creds -n cicd \
#     tekton.dev/git-0=http://gitea.lab.local
#
#   # 3. gitea-webhook-secret — segredo HMAC compartilhado com o Gitea para
#   #    validar a assinatura X-Gitea-Signature dos eventos de push.
#   kubectl create secret generic gitea-webhook-secret \
#     --from-literal=secretToken=<GERAR_TOKEN_ALEATORIO_FORTE> \
#     -n cicd
#
# Replicação (caso PipelineRuns rodem em outro namespace que não `cicd`):
#   kubectl get secret harbor-creds -n cicd -o yaml \
#     | sed 's/namespace: cicd/namespace: <novo-ns>/' \
#     | kubectl apply -f -
#
# Para verificar:
#   kubectl get secrets -n cicd | grep -E 'harbor-creds|gitea-creds|gitea-webhook'
# =============================================================================
---
# PLACEHOLDER — substituir <BASE64_DOCKERCONFIGJSON> antes de aplicar (NÃO RECOMENDADO).
# Preferível usar `kubectl create secret docker-registry` (acima).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-creds
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: registry-credentials
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
  annotations:
    description: "Push para harbor.infra.local. Substituir via kubectl create secret docker-registry."
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: PEJBU0U2NF9ET0NLRVJDT05GSUdKU09OPg==  # <BASE64_DOCKERCONFIGJSON>
---
# PLACEHOLDER — gitea-creds (basic-auth).
apiVersion: v1
kind: Secret
metadata:
  name: gitea-creds
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: git-credentials
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
  annotations:
    tekton.dev/git-0: http://gitea.lab.local
    description: "Clone do mirror Gitea privado. Substituir via kubectl create secret generic."
type: kubernetes.io/basic-auth
stringData:
  username: "<GITEA_USER>"
  password: "<GITEA_TOKEN>"
---
# PLACEHOLDER — segredo HMAC do webhook do Gitea.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-webhook-secret
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: webhook-secret
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
type: Opaque
stringData:
  secretToken: "<TOKEN_ALEATORIO_FORTE>"
