---
# =============================================================================
# Tekton Triggers — amfit
# Recebe eventos de push do Gitea e cria PipelineRuns para api + web.
# Path-filtering avançado (mudou só apps/api/?) fica para Fase 2 — por ora
# qualquer push em `main` dispara os dois pipelines.
# =============================================================================
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: amfit-gitea-binding
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: trigger-binding
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-revision-short
      value: $(extensions.short_sha)
    - name: git-ref
      value: $(body.ref)
    - name: pusher
      value: $(body.pusher.username)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: amfit-build-template
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: trigger-template
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: git-revision-short
    - name: git-ref
    - name: pusher
      default: unknown
  # ATENCAO: a API do Tekton Triggers v1beta1 espera "resourcetemplates"
  # (tudo minusculo) — "resourceTemplates" (camelCase) e um campo
  # desconhecido pro schema do CRD e e descartado silenciosamente pelo
  # apiserver antes de gravar. kubectl apply reportava "configured" e a
  # annotation last-applied-configuration acumulava o valor "certo", mas o
  # spec.resourcetemplates de verdade nunca mudava — o objeto ficou preso
  # no estado de quando foi criado (08/05), com harbor.infra.local e
  # nodeSelector workload:cicd, apesar de VARIAS correcoes terem sido
  # commitadas (e aparentemente aplicadas) desde entao. So descoberto em
  # 2026-09-04 comparando contra o TriggerTemplate do REALTPMSYS (que usa a
  # grafia certa e funciona) apos um push real continuar falhando mesmo
  # com o arquivo aparentemente corrigido.
  resourcetemplates:
    # -------------------------------------------------------------------------
    # PipelineRun — API
    # -------------------------------------------------------------------------
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: amfit-build-api-$(tt.params.git-revision-short)-
        namespace: cicd
        labels:
          app.kubernetes.io/name: amfit-tekton
          app.kubernetes.io/component: pipelinerun-api
          app.kubernetes.io/managed-by: argocd
          environment: dev
          lab_id: lab-k8s-01
          lab_owner: jose.mussauer
          tekton.dev/pipeline: amfit-build-api
          trigger: gitea-push
          git-revision-short: $(tt.params.git-revision-short)
        annotations:
          gitea.io/pusher: $(tt.params.pusher)
          gitea.io/ref: $(tt.params.git-ref)
      spec:
        pipelineRef:
          name: amfit-build-api
        taskRunTemplate:
          serviceAccountName: tekton-amfit
          podTemplate:
            # REVERTIDO em 2026-09-08 apos teste ao vivo: tentei mover pra
            # workload:cicd (k3s-worker-cicd) + workspace em nfs-storage,
            # pensando que trocar o workspace do disco local pro NFS tiraria
            # a disputa de disco do kaniko com os PVs do Harbor
            # (Postgres/registry/trivy/redis, tambem em local-path nesse
            # node). ERRADO: o snapshotting de camadas do kaniko usa a
            # propria camada gravavel do container (containerd/overlay2),
            # que fica SEMPRE no disco local do node onde o pod roda —
            # totalmente independente de qual storageClass o workspace
            # Tekton usa. Confirmado ao vivo: harbor-database-0 reiniciou de
            # novo (restart 5->6) durante o kaniko-build-push mesmo com
            # nfs-storage. Voltou pra ubuntu-neto (unico node sem esse
            # risco). O ganho real desta rodada de fixes foi outro: os
            # timeouts intermitentes de rede (proxy.golang.org, Harbor
            # token service) — mitigados com retries no pipeline (ver
            # pipeline-api.yaml/pipeline-web.yaml), nao com troca de node.
            nodeSelector:
              kubernetes.io/hostname: ubuntu-neto
            securityContext:
              fsGroup: 65532
        timeouts:
          pipeline: "45m"
          tasks: "30m"
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-repo
            value: harbor.lab.local/amfit/api
          - name: image-tag
            value: latest
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
          - name: docker-credentials
            secret:
              secretName: harbor-creds

    # -------------------------------------------------------------------------
    # PipelineRun — Web
    # -------------------------------------------------------------------------
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: amfit-build-web-$(tt.params.git-revision-short)-
        namespace: cicd
        labels:
          app.kubernetes.io/name: amfit-tekton
          app.kubernetes.io/component: pipelinerun-web
          app.kubernetes.io/managed-by: argocd
          environment: dev
          lab_id: lab-k8s-01
          lab_owner: jose.mussauer
          tekton.dev/pipeline: amfit-build-web
          trigger: gitea-push
          git-revision-short: $(tt.params.git-revision-short)
        annotations:
          gitea.io/pusher: $(tt.params.pusher)
          gitea.io/ref: $(tt.params.git-ref)
      spec:
        pipelineRef:
          name: amfit-build-web
        taskRunTemplate:
          serviceAccountName: tekton-amfit
          podTemplate:
            # ubuntu-neto e o UNICO node do cluster com >=8Gi de RAM (os
            # outros: k3s-worker-cicd ~6Gi, k3s-server/ci-runner ~4Gi,
            # raspneto <1Gi) — exigido pelo pnpm install/kaniko snapshot do
            # Next.js. Tambem hospeda o Pi-hole (DNS de toda a rede) +
            # monitoring sob disputa real de recursos, o que explica os
            # timeouts intermitentes de rede que quebraram todo build desde
            # 2026-09-04 — mitigado com retries no pipeline (ver
            # pipeline-web.yaml) em vez de trocar de node (achado em
            # 2026-09-08: nao ha outro node com RAM suficiente).
            # storageClassName fica em local-path — testei nfs-storage
            # pensando que reduziria a disputa de disco do kaniko, mas o
            # snapshotting de camadas usa a camada gravavel do container
            # (containerd/overlay2), sempre local ao node, independente da
            # storageClass do workspace — nfs so trazia complexidade
            # (quirks de POSIX lock) sem beneficio real.
            nodeSelector:
              kubernetes.io/hostname: ubuntu-neto
            securityContext:
              fsGroup: 65532
        timeouts:
          pipeline: "45m"
          tasks: "30m"
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-repo
            value: harbor.lab.local/amfit/web
          - name: image-tag
            value: latest
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 8Gi
          - name: docker-credentials
            secret:
              secretName: harbor-creds
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: amfit-gitea-push
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: trigger
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  serviceAccountName: tekton-amfit
  # NOTA (2026-09-01): o ClusterInterceptor "gitea" NÃO está instalado neste
  # cluster (só existem os builtins cel, github, gitlab, bitbucket, slack —
  # confirmado via `kubectl get clusterinterceptor`). A referência anterior
  # a `ref: {name: gitea}` aqui fazia CADA chamada de webhook falhar antes
  # de chegar no filtro CEL, mesmo com o webhook do Gitea configurado
  # corretamente — bug real.
  #
  # NOTA (2026-09-03): validação de assinatura HMAC adicionada reaproveitando
  # o ClusterInterceptor "github" já instalado — confirmado no código-fonte
  # do Gitea 1.25.5 (services/webhook/deliver.go) que, além do
  # X-Gitea-Signature nativo, o Gitea também envia X-Hub-Signature-256 no
  # formato exato do GitHub (HMAC-SHA256, prefixo "sha256=", mesmo secret do
  # webhook) especificamente para compatibilidade. Mesma solução aplicada em
  # infra/tekton/triggers.yaml do REALTPMSYS. secretRef aponta pro Secret
  # gitea-webhook-secret (cicd) já criado e configurado no webhook do Gitea.
  interceptors:
    - ref:
        kind: ClusterInterceptor
        name: github
      params:
        - name: secretRef
          value:
            secretName: gitea-webhook-secret
            secretKey: secretToken
    # Filtra: só dispara em push para refs/heads/main.
    - ref:
        name: cel
      params:
        - name: filter
          value: "body.ref == 'refs/heads/main'"
        - name: overlays
          value:
            - key: short_sha
              expression: "body.head_commit.id.truncate(7)"
  bindings:
    - ref: amfit-gitea-binding
  template:
    ref: amfit-build-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: amfit-event-listener
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: event-listener
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
spec:
  serviceAccountName: tekton-amfit
  triggers:
    - triggerRef: amfit-gitea-push
  resources:
    kubernetesResource:
      serviceType: ClusterIP
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/name: amfit-tekton
              app.kubernetes.io/component: event-listener
              environment: dev
              lab_id: lab-k8s-01
              lab_owner: jose.mussauer
          spec:
            nodeSelector:
              workload: cicd
            tolerations:
              - key: workload
                operator: Equal
                value: cicd
                effect: NoSchedule
            # Tekton Triggers preenche `containers[0].name` automaticamente
            # ("event-listener") — o webhook rejeita se setarmos manualmente.
            # Apenas overrides de resources sao permitidos aqui.
            containers:
              - resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
