---
# Smoke run manual — dispara o pipeline amfit-build-web uma vez.
#
#   kubectl create -f infra/tekton/pipelinerun-web-manual.yaml -n cicd
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: amfit-build-web-manual-
  namespace: cicd
  labels:
    app.kubernetes.io/name: amfit-tekton
    app.kubernetes.io/component: pipelinerun-web
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
    tekton.dev/pipeline: amfit-build-web
    trigger: manual
spec:
  pipelineRef:
    name: amfit-build-web
  taskRunTemplate:
    serviceAccountName: tekton-amfit
    podTemplate:
      # Build do Web exige 8Gi pelo pnpm install. k3s-worker-cicd so tem 6Gi
      # (ExceededNodeResources). ubuntu-neto tem 8Gi. Sem tolerations porque
      # o no nao tem taint.
      nodeSelector:
        kubernetes.io/hostname: ubuntu-neto
      securityContext:
        fsGroup: 65532
  # Override de recursos: o kaniko-build-push do lab tem limit 4Gi que
  # estoura no build do Web (pnpm install do Next.js + snapshotter Kaniko).
  taskRunSpecs:
    - pipelineTaskName: kaniko-build-push
      stepSpecs:
        - name: build-and-push
          computeResources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 8Gi
  timeouts:
    pipeline: "45m"
    tasks: "30m"
  params:
    # Usar FQDN K8s interno (gitea.lab.local nao tem porta 80, so 3000 via LB).
    - name: git-url
      value: http://gitea-http.cicd.svc.cluster.local:3000/labadmin/amfit.git
    - name: git-revision
      value: main
    - name: image-repo
      value: harbor.lab.local/amfit/web
    - name: image-tag
      value: latest
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 8Gi
    - name: docker-credentials
      secret:
        secretName: harbor-creds
