apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amfit
  # ArgoCD do lab roda no namespace cicd (nao argocd).
  namespace: cicd
  labels:
    app.kubernetes.io/name: "amfit"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Gitea local mirroreia o repo do GitHub. Owner = labadmin.
    # Usa FQDN K8s interno + porta correta (gitea.lab.local nao expoe :80,
    # so via LB MetalLB na porta 3000). Mesmo padrao que o Tekton.
    repoURL: http://gitea-http.cicd.svc.cluster.local:3000/labadmin/amfit.git
    targetRevision: main
    path: infra/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: amfit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
