apiVersion: v1
kind: Secret
metadata:
  name: amfit-secrets
  namespace: amfit
  labels:
    app.kubernetes.io/name: "amfit"
    app.kubernetes.io/component: "config"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
type: Opaque
stringData:
  pg-password: "amfit123!"
  redis-password: "redis123!"
  minio-access-key: "amfit-minio"
  minio-secret-key: "amfit-minio-secret"
  # Substituir pelos PEMs gerados via `make keys` em apps/api/keys/
  # Os valores devem ser o conteúdo bruto dos arquivos .pem (multiline OK em stringData).
  # Em produção, migrar para Sealed Secrets ou SOPS antes de commitar.
  jwt-private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_PEM_CONTENT
    -----END RSA PRIVATE KEY-----
  jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_PUBLIC_PEM_CONTENT
    -----END PUBLIC KEY-----
