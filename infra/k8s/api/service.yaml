apiVersion: v1
kind: Service
metadata:
  name: amfit-api
  namespace: amfit
  labels:
    app.kubernetes.io/name: "amfit-api"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  # Exposicao via MetalLB (lab nao tem IngressController). DNS:
  # api.amfit.local -> 192.168.1.205
  type: LoadBalancer
  loadBalancerIP: 192.168.1.205
  selector:
    app.kubernetes.io/name: "amfit-api"
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
