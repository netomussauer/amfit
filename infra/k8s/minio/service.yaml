apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: amfit
  labels:
    app.kubernetes.io/name: "minio"
    app.kubernetes.io/component: "storage"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  # Exposicao via MetalLB para servir midia publica do bucket exercicios.
  # DNS sugerido: minio.amfit.local -> 192.168.1.207 (porta 9000 = S3 API,
  # porta 9001 = console). Sem TLS no MVP, MIDIA_PUBLIC_URL usa http://.
  type: LoadBalancer
  loadBalancerIP: 192.168.1.207
  selector:
    app.kubernetes.io/name: "minio"
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
