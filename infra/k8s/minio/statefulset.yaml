apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: amfit
  labels:
    app.kubernetes.io/name: "minio"
    app.kubernetes.io/version: "RELEASE.2025-09-07T16-13-09Z"
    app.kubernetes.io/component: "storage"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  serviceName: minio
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: "minio"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "minio"
        app.kubernetes.io/version: "RELEASE.2025-09-07T16-13-09Z"
        app.kubernetes.io/component: "storage"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          # A MinIO Inc. parou de distribuir imagens públicas: o Docker Hub
          # foi descontinuado e o `quay.io/minio/minio` passou a devolver
          # 401 UNAUTHORIZED em pull anônimo (ImagePullBackOff em 09/2026).
          # Usa a imagem pública da Chainguard, fixada por digest (índice
          # multi-arch, `latest` de 2026-09-24) pra não depender de tag
          # mutável. Ao atualizar, troque o digest deliberadamente.
          # A imagem é minimalista (não se presume o `mc` nela), por isso
          # o liveness usa o endpoint HTTP nativo.
          image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: amfit-secrets
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amfit-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "minio"
          app.kubernetes.io/component: "storage"
          environment: "dev"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
