apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: amfit
  labels:
    app.kubernetes.io/name: "minio"
    app.kubernetes.io/version: "RELEASE.2025-09-07T16-13-09Z"
    app.kubernetes.io/component: "storage"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  serviceName: minio
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: "minio"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "minio"
        app.kubernetes.io/version: "RELEASE.2025-09-07T16-13-09Z"
        app.kubernetes.io/component: "storage"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          # O Docker Hub descontinuou o repositório `minio/minio` (a MinIO
          # Inc. migrou a distribuição oficial pro Quay.io) — `latest`
          # passou a devolver "pull access denied" mesmo já tendo
          # funcionado antes. Fixado numa release específica (não
          # `:latest` do Quay também) pra não depender de qual tag esse
          # alias aponta no futuro.
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: amfit-secrets
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amfit-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - mc
                - ready
                - local
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "minio"
          app.kubernetes.io/component: "storage"
          environment: "dev"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
