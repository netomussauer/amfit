---
# Concede ao ServiceAccount do Tekton (cicd/tekton-amfit) permissao pra
# reiniciar os Deployments deste namespace apos um push de imagem bem
# sucedido — os Deployments usam a tag :latest (sem mudanca no manifesto a
# cada build), entao nem kubectl nem o ArgoCD reiniciam os pods sozinhos; o
# pipeline precisa fazer isso explicitamente (ver o task "rollout-restart"
# em infra/tekton/pipeline-api.yaml e pipeline-web.yaml). Mesmo padrao ja
# usado com sucesso pelo REALTPMSYS (namespace realtpmsys, mesma Role
# "tekton-rollout").
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-rollout
  namespace: amfit
  labels:
    app.kubernetes.io/name: amfit
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-rollout
  namespace: amfit
  labels:
    app.kubernetes.io/name: amfit
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: argocd
    environment: dev
    lab_id: lab-k8s-01
    lab_owner: jose.mussauer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-rollout
subjects:
  - kind: ServiceAccount
    name: tekton-amfit
    namespace: cicd
