apiVersion: apps/v1
kind: Deployment
metadata:
  name: amfit-web
  namespace: amfit
  labels:
    app.kubernetes.io/name: "amfit-web"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "amfit-web"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "amfit-web"
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: "frontend"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      # Harbor exige autenticacao para pull. harbor-pull-secret e criado
      # uma vez no ns amfit clonando harbor-creds do ns cicd (robot account
      # tekton-pusher com push+pull em amfit/*).
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        # uid/gid 65532 = nonroot user da imagem distroless (gcr.io/distroless/nodejs20-debian12:nonroot)
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: web
          image: harbor.lab.local/amfit/web:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # API_ORIGIN e usado pelo route handler catch-all em
            # src/app/api/v1/[...path]/route.ts para fazer proxy server-side
            # de /api/v1/* para o backend (rewrites() do next.config.mjs foi
            # abandonado em favor desse route handler). Mantemos a chamada
            # cluster-internal (sem TLS, sem DNS Pi-hole).
            - name: API_ORIGIN
              value: "http://amfit-api.amfit.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js escreve em .next/cache em runtime — readOnlyRootFilesystem requer emptyDir mount
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
