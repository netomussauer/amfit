apiVersion: apps/v1
kind: Deployment
metadata:
  name: amfit-web
  namespace: amfit
  labels:
    app.kubernetes.io/name: "amfit-web"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "amfit-web"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "amfit-web"
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: "frontend"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          image: harbor.infra.local/amfit/web:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.amfit.local"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js escreve em .next/cache em runtime — readOnlyRootFilesystem requer emptyDir mount
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
